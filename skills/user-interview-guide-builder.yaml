id: user-interview-guide-builder
name: User Interview Guide Builder
description: >
  Builds discovery and usability interview guides that surface real insight. Translates
  research questions into open, non-leading prompts, sequences warm-up to deep-dive topics,
  adds follow-up probes, and applies techniques like the "five whys" and past-behavior
  questions. Outputs a timed guide with a consent intro and a synthesis template for notes.
category: research
tags:
  - user-research
  - interviews
  - discovery
  - ux-research
  - qualitative
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - claude-sonnet-4-5
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Creating a discovery interview guide from research goals
  - Writing non-leading questions and follow-up probes
  - Structuring a timed session from warm-up to deep dive
  - Preparing a synthesis template to capture findings
example_prompt: |
  Build a 30-minute discovery interview guide.

  Goal: understand how small teams currently manage on-call and where it breaks down.

  Deliver:
  1. A short consent/intro script
  2. A timed flow (warm-up, current process, pain points, wrap-up)
  3. Open, non-leading questions with follow-up probes
  4. A few past-behavior questions ("tell me about the last time...")
  5. A synthesis template to capture themes after the session
  Avoid questions that lead the participant toward our product.
related_skills:
  - survey-designer
  - market-research-analyst
  - research-summarizer
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
