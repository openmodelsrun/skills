id: agentcore-operations-review
name: AgentCore Operations Review
description: >
  Reviews Amazon Bedrock AgentCore runtime, memory, identity, gateway, policy,
  browser, and code-interpreter operations before deployment. Separates read-only,
  billable, mutating, and destructive actions and produces scoped enablement,
  observability, rollback, and cost-control recommendations.
category: ops
tags: [aws, bedrock, agentcore, ai-agents, operations, security]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
