recommended_models: [gpt-5-6-sol, claude-opus-5, gemini-3-6-flash]
min_context_window: 64000
modalities: {input: [text, code], output: [text]}
complexity: advanced
use_cases:
  - Reviewing AgentCore runtime and gateway rollout plans
  - Scoping memory, identity, browser, and interpreter tools
  - Separating billable and destructive operations
  - Designing rollback and audit controls for agent infrastructure
example_prompt: |
  Review this Amazon Bedrock AgentCore deployment and operations plan.

  Context: [architecture, regions, environments, IAM roles, expected traffic]
  Enabled primitives: [runtime, memory, identity, gateway, policy, browser, code_interpreter]

  Return:
  1. A primitive-by-primitive necessity review.
  2. Read-only, billable, mutating, and destructive operation classes.
  3. Least-privilege IAM and identity boundaries.
  4. Session lifecycle, timeout, and cost controls.
  5. Observability signals and incident runbooks.
  6. A staged rollout and tested rollback plan.
related_skills: [ai-agent-builder, iam-policy-reviewer, security-audit]
compatible_tools: [claude-code, cursor, kiro, gemini-cli, any]
