id: browser-extension-builder
name: Browser Extension Builder
description: >
  Builds cross-browser extensions on Manifest V3 with background service workers, content scripts,
  popup and options UIs, and message passing. Covers permissions scoping, storage sync, context
  menus, and store submission requirements for Chrome, Edge, and Firefox. Emphasizes least-privilege
  permissions and secure content-script isolation.
category: development
tags:
  - browser-extension
  - manifest-v3
  - chrome
  - firefox
  - frontend
  - web
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Scaffolding a Manifest V3 extension with popup and options pages
  - Adding a content script that safely modifies a page
  - Implementing message passing between background and content scripts
  - Scoping least-privilege permissions
  - Preparing an extension for Chrome Web Store submission
example_prompt: |
  Build a Manifest V3 browser extension that highlights and saves selected text on any page.
  Include:
  1. manifest.json with least-privilege permissions
  2. A content script for selection and highlighting
  3. A background service worker for storage
  4. A popup to view saved highlights
  5. Cross-browser notes for Chrome and Firefox
related_skills:
  - react-component-generator
  - frontend-design
  - security-audit
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
