id: incident-comms-writer
name: Incident Comms Writer
description: >
  Writes clear, calm customer-facing incident communications during an active outage: status-page
  updates, in-app banners, and stakeholder emails. Adapts the message to the incident phase
  (investigating, identified, monitoring, resolved), states impact and scope honestly without
  leaking sensitive detail, and keeps a consistent tone across updates.
category: ops
tags:
  - incident
  - communications
  - status-page
  - customer-communication
  - devops
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - gemini-3-5-flash-lite
min_context_window: 16000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Drafting a status-page update for each incident phase
  - Writing a customer email for a major outage
  - Producing a concise in-app banner during degradation
  - Keeping tone and facts consistent across sequential updates
example_prompt: |
  We have an active incident. Write a status-page update.

  Phase: identified
  Impact: checkout is failing for about 20% of users in the EU region
  What we know: a database failover is in progress; no data loss
  Next update: in 30 minutes

  Keep it calm and clear, state the impact and scope honestly, avoid internal jargon and sensitive
  details, and end with when the next update will come.
related_skills:
  - incident-response
  - incident-postmortem-writer
  - runbook-generator
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-25T00:00:00.000Z"
updated_at: "2026-07-25T00:00:00.000Z"
