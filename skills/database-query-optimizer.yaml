id: database-query-optimizer
name: Database Query Optimizer
description: >
  Analyzes SQL queries and database schemas to identify performance bottlenecks and
  suggest optimizations. Recommends index strategies, query rewrites, denormalization
  opportunities, and partitioning schemes. Explains EXPLAIN plans and provides
  before/after comparisons with expected performance improvements.
category: data
tags:
  - sql
  - database
  - performance
  - indexing
  - postgresql
  - optimization
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5-5-pro
  - deepseek-v4
  - qwen3-235b
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: advanced
use_cases:
  - Optimizing slow queries identified in production monitoring
  - Designing index strategies for high-traffic tables
  - Rewriting N+1 queries into efficient JOINs or CTEs
  - Planning table partitioning for large datasets
  - Analyzing EXPLAIN output and recommending fixes
example_prompt: |
  Optimize this PostgreSQL query that takes 4.2 seconds on a table with 50M rows:

  ```sql
  SELECT u.name, u.email, COUNT(o.id) as order_count, SUM(o.total) as lifetime_value
  FROM users u
  LEFT JOIN orders o ON o.user_id = u.id
  WHERE u.created_at > '2024-01-01'
    AND u.status = 'active'
    AND o.status != 'cancelled'
  GROUP BY u.id, u.name, u.email
  HAVING COUNT(o.id) > 5
  ORDER BY lifetime_value DESC
  LIMIT 100;
  ```

  Current indexes: users(id), orders(id), orders(user_id)

  Provide:
  1. Analysis of why it's slow
  2. Recommended indexes with CREATE INDEX statements
  3. Rewritten query if applicable
  4. Expected performance improvement
  5. Any schema changes to consider
related_skills:
  - sql-generation
  - schema-design
  - performance-optimization
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
