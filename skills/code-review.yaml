id: code-review
name: Code Review
description: >
  Automated code review that provides actionable feedback on code quality, potential bugs,
  performance issues, security vulnerabilities, and style violations. Analyzes code changes
  with the rigor of a senior engineer, providing specific suggestions with code examples.
category: development
tags:
  - code-quality
  - automation
  - developer-tools
  - pull-request
  - best-practices
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 32000
modalities:
  input:
    - code
    - text
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Pull request review automation
  - Code quality gates in CI pipelines
  - Pre-commit code analysis
  - Mentoring junior developers through code feedback
  - Enforcing team coding standards
example_prompt: |
  Review the following code changes for:
  1. Potential bugs or logic errors
  2. Performance issues or inefficiencies
  3. Security vulnerabilities
  4. Style violations and readability concerns
  5. Missing error handling or edge cases

  For each issue found, provide:
  - Severity (critical/warning/suggestion)
  - Explanation of the problem
  - Concrete fix with code example

  Code to review:
  ```
  [paste code here]
  ```
related_skills:
  - unit-test-generation
  - security-audit
  - refactoring-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
