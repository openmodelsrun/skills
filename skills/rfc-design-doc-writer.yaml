id: rfc-design-doc-writer
name: RFC and Design Doc Writer
description: >
  Writes an engineering RFC or design document for a proposed change. Frames the problem
  and goals, states non-goals, describes the proposed design with diagrams in text,
  compares alternatives with trade-offs, and covers rollout, migration, testing, risks,
  and open questions so reviewers can make a decision.
category: writing
tags: [rfc, design-doc, technical-writing, architecture, proposal]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-opus-5-5, gpt-6-astra, gpt-6-1-sol]
min_context_window: 32000
modalities: {input: [text, code], output: [text, code]}
complexity: intermediate
use_cases:
  - Proposing a new service, schema, or protocol change
  - Documenting alternatives considered before a large refactor
  - Turning a discussion thread into a reviewable proposal
  - Preparing a design review for a cross-team change
example_prompt: |
  Write an RFC for this change.

  Context: [problem, constraints, proposed approach, stakeholders]

  Return:
  1. Summary, motivation, goals, and non-goals.
  2. Proposed design with data flow and interfaces.
  3. Alternatives considered with trade-offs.
  4. Rollout, migration, and testing plan.
  5. Risks and open questions for reviewers.
related_skills: [architecture-decision-record, technical-writing, system-design]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
