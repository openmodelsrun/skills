id: video-script-writer
name: Video Script Writer
description: >
  Writes scripts for short and long-form video. Opens with a hook, structures the
  narrative into timed segments, pairs narration with on-screen visuals and b-roll
  suggestions, adapts tone and pacing to the platform and audience, and ends with a clear
  call to action.
category: creative
tags: [video, script, storytelling, content, youtube]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-sonnet-5-5, gpt-6-1-sol, gemini-3-8-flash]
min_context_window: 16000
modalities: {input: [text], output: [text]}
complexity: beginner
use_cases:
  - Scripting a product demo or launch video
  - Writing a short vertical video with a strong first three seconds
  - Turning a blog post into a narrated explainer
  - Planning narration and visuals for a tutorial
example_prompt: |
  Write a video script.

  Context: [topic, audience, platform, target length, tone]

  Return:
  1. Three hook options.
  2. Timed outline of segments.
  3. Full narration with matching visual directions.
  4. On-screen text and b-roll suggestions.
  5. Closing call to action and title options.
related_skills: [storyboard-generator, ad-copy-writer, social-media-post-writer]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
