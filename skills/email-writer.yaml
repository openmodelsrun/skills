id: email-writer
name: Professional Email Writer
description: >
  Drafts professional emails for various business contexts — follow-ups, introductions,
  requests, escalations, and announcements. Adapts tone from formal to friendly based on
  audience and relationship. Keeps messages concise and action-oriented.
category: writing
tags:
  - email
  - communication
  - business-writing
  - professional
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-sonnet-4-6
  - gpt-5-4-mini
  - gemini-2-5-flash
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Writing cold outreach emails
  - Following up after meetings
  - Escalating issues to management
  - Announcing product launches or changes
  - Requesting feedback or approvals
example_prompt: |
  Write a professional email for the following situation:

  Context: [describe the situation]
  Recipient: [role/relationship, e.g., "engineering manager", "client"]
  Tone: [formal / friendly-professional / casual]
  Goal: [what you want the recipient to do]

  Key points to include:
  - [point 1]
  - [point 2]
  - [point 3]

  Constraints:
  - Keep under 150 words
  - Include a clear call-to-action
  - Subject line included
related_skills:
  - documentation-generator
  - error-message-improver
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-05-24T12:00:00.000Z"
updated_at: "2026-05-24T12:00:00.000Z"
