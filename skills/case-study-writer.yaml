id: case-study-writer
name: Case Study Writer
description: >
  Turns customer results into a persuasive, credible case study. Structures the story as
  challenge, solution, and measurable results, weaves in quotes and concrete metrics, keeps
  claims verifiable, and ends with a clear call to action. Produces a publish-ready draft
  plus a one-paragraph summary and pull-quote suggestions.
category: writing
tags:
  - case-study
  - marketing
  - storytelling
  - b2b
  - content
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - mistral-large-3
min_context_window: 16000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Turning an interview transcript into a structured case study
  - Framing customer results as challenge/solution/outcome
  - Highlighting verifiable metrics and quotes
  - Producing a summary and pull quotes for a landing page
example_prompt: |
  Write a B2B case study from the notes below.

  Customer: a fintech startup
  Challenge: manual fraud review didn't scale
  Solution: adopted our real-time scoring API
  Results: review time down 70%, false positives down 30%, went live in 3 weeks
  Quote: "We shipped in weeks, not quarters." — VP Engineering

  Deliver:
  1. A structured case study (challenge, solution, results)
  2. A one-paragraph summary for the top of the page
  3. Two pull-quote suggestions
  Keep every metric traceable to the notes; don't invent numbers.
related_skills:
  - blog-post-writer
  - technical-writing
  - competitive-intelligence-analyst
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
