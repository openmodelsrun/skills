id: terraform-module-writer
name: Terraform Module Writer
description: >
  Writes reusable, well-structured Terraform modules with clean input/output interfaces, sensible
  defaults, validation rules, and examples. Covers module composition, variable typing and
  validation, remote state and backends, provider version pinning, and testing with terraform
  validate/plan and tools like Terratest. Emphasizes least-privilege IAM and safe defaults.
category: ops
tags:
  - terraform
  - infrastructure-as-code
  - modules
  - cloud
  - devops
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Writing a reusable VPC or database module
  - Adding variable validation and typed inputs
  - Structuring modules with examples and outputs
  - Pinning provider versions and configuring backends
  - Setting up module tests with plan/validate
example_prompt: |
  Write a reusable Terraform module for an AWS S3 bucket with:
  1. Typed variables with validation and sensible defaults
  2. Encryption, versioning, and public-access-block by default
  3. Clear outputs (bucket name, ARN)
  4. An example usage and README section
  5. Provider version pinning and a basic test plan
related_skills:
  - infrastructure-as-code
  - cloud-deploy
  - iam-policy-reviewer
compatible_tools:
  - claude-code
  - kiro
  - cursor
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
