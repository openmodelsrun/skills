id: property-based-test-generator
name: Property-Based Test Generator
description: >
  Generates property-based tests that assert invariants across randomly generated inputs using
  frameworks like Hypothesis, fast-check, or jqwik. Identifies properties (round-trip, idempotence,
  invariants, oracle comparison), defines generators and shrinking, and sets up stateful testing
  for complex APIs. Surfaces edge cases that example-based tests miss.
category: testing
tags:
  - property-based-testing
  - fuzzing
  - hypothesis
  - fast-check
  - qa
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: advanced
use_cases:
  - Adding property-based tests for a parser or serializer
  - Testing round-trip and idempotence properties
  - Defining custom generators and shrinking
  - Stateful testing of a data structure or API
  - Finding edge cases example tests miss
example_prompt: |
  Generate property-based tests for this function: [paste function].
  Include:
  1. Identified properties (round-trip, invariants, oracle)
  2. Input generators and shrinking strategy
  3. Tests using [Hypothesis/fast-check/jqwik]
  4. A stateful test if applicable
  5. Notes on edge cases the properties should reveal
related_skills:
  - unit-test-generation
  - test-data-generator
  - flaky-test-detector
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
