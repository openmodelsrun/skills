id: knowledge-graph
name: Knowledge Graph Builder
description: >
  Builds and queries typed knowledge graphs for structured agent memory and composable
  skills. Creates entities (people, projects, tasks, events, documents), links related
  objects, enforces constraints, and plans multi-step actions as graph transformations.
  Enables persistent, queryable memory across agent sessions.
category: data
tags:
  - knowledge-graph
  - memory
  - entities
  - relationships
  - structured-data
  - ontology
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5-5
  - deepseek-v4
  - gemini-2-5-pro
min_context_window: 64000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
    - file
complexity: advanced
use_cases:
  - Building project knowledge bases with entities and relationships
  - Tracking dependencies between tasks, people, and systems
  - Creating queryable memory for long-running agent workflows
  - Mapping organizational structures and team responsibilities
  - Linking research papers, concepts, and findings
example_prompt: |
  Build a knowledge graph for this project:

  Entities to track:
  - Team members (name, role, expertise)
  - Services (name, tech stack, dependencies)
  - Tasks (description, status, assignee, blockers)

  Create the graph with:
  1. Entity definitions with typed properties
  2. Relationship types (owns, depends-on, blocks, assigned-to)
  3. Constraints (e.g., a task can only have one assignee)
  4. Query examples: "What blocks the auth service release?"
related_skills:
  - schema-design
  - data-analysis
  - system-design
compatible_tools:
  - claude-code
  - kiro
  - opencode
  - any
