id: helm-chart-generator
name: Helm Chart Generator
description: >
  Generates and refactors Helm charts to package Kubernetes applications. Produces templated
  manifests, values.yaml with sensible defaults, helpers, chart dependencies, and hooks, and
  parameterizes images, resources, probes, and ingress so a workload can be deployed
  consistently across environments.
category: ops
tags:
  - helm
  - kubernetes
  - charts
  - packaging
  - devops
  - deployment
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - code
    - text
complexity: intermediate
use_cases:
  - Packaging an existing app into a reusable Helm chart
  - Templating deployments, services, and ingress with values
  - Defining environment-specific values overrides
  - Adding chart dependencies and hooks
  - Parameterizing resources, probes, and autoscaling
example_prompt: |
  Generate a Helm chart for a stateless Node.js API.

  Requirements:
  - Configurable image repo/tag, replica count, and resources
  - Liveness/readiness probes on /healthz
  - Optional ingress with TLS
  - Separate values for staging and production

  Provide the chart structure, key templates, and values files.
related_skills:
  - kubernetes-manifest-generator
  - infrastructure-as-code
  - cloud-deploy
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-06-24T00:00:00.000Z"
updated_at: "2026-06-24T00:00:00.000Z"
