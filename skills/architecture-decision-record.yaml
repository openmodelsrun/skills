id: architecture-decision-record
name: Architecture Decision Record
description: >
  Produces clear, reviewable architecture decision records that capture context,
  alternatives, trade-offs, consequences, rollout steps, and reversal criteria.
category: development
tags: [architecture, adr, technical-decisions, documentation]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 16000
modalities: {input: [text, code], output: [text]}
complexity: intermediate
use_cases: [Architecture reviews, Technology selection, Decision documentation]
example_prompt: "Write an ADR for choosing between these options. State the decision, constraints, alternatives, trade-offs, consequences, rollout plan, and conditions to revisit it."
related_skills: [system-design, migration-planner]
compatible_tools: [claude-code, cursor, kiro, any]
