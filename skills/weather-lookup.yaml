id: weather-lookup
name: Weather Lookup
description: >
  Fetches current weather conditions and forecasts for any location using free public APIs.
  Provides temperature, humidity, wind, precipitation probability, and multi-day forecasts.
  Useful for agents that need environmental context for travel planning, event scheduling,
  or outdoor activity recommendations.
category: productivity
tags:
  - weather
  - api
  - location
  - forecast
  - travel
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - gpt-5-4
  - claude-sonnet-4-6
  - gemini-2-5-flash
  - qwen3-32b
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Getting current weather for a city before recommending activities
  - Multi-day forecast for trip planning
  - Comparing weather across multiple destinations
  - Alerting about severe weather conditions
  - Providing context for outdoor event scheduling
example_prompt: |
  What's the weather like in Tokyo right now?
  Also show me the 5-day forecast including:
  - Temperature (high/low)
  - Precipitation probability
  - Wind speed and direction
  - Humidity levels
  - Best days for outdoor activities
related_skills:
  - research-summarizer
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-05-25T12:00:00.000Z"
updated_at: "2026-05-25T12:00:00.000Z"
