id: decision-matrix-builder
name: Decision Matrix Builder
description: >
  Helps make and document structured decisions. Elicits the options and the criteria that
  matter, assigns weights, scores each option, computes a weighted result, and runs a quick
  sensitivity check to show how robust the recommendation is. Produces a clear matrix plus a
  short written rationale suitable for an ADR or decision log.
category: productivity
tags:
  - decision-making
  - trade-offs
  - evaluation
  - prioritization
  - planning
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - claude-sonnet-4-5
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Comparing tools or vendors against weighted criteria
  - Documenting a technical decision as an ADR
  - Making a hiring or roadmap trade-off transparent
  - Sanity-checking a choice with a sensitivity analysis
example_prompt: |
  Build a weighted decision matrix to choose a background job queue.

  Options: Sidekiq, BullMQ, Temporal
  Criteria I care about (help me weight them): reliability, operational overhead, language
  fit (Node), observability, cost.

  Steps:
  1. Propose weights and confirm they sum to 100
  2. Score each option per criterion (1-5) with a one-line justification
  3. Compute the weighted totals and give a recommendation
  4. Run a sensitivity check: which weight change would flip the decision?

  Finish with a 4-sentence rationale I can paste into an ADR.
related_skills:
  - task-prioritizer
  - system-design
  - migration-planner
compatible_tools:
  - claude-code
  - kiro
  - any
