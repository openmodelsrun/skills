id: documentation-generator
name: Documentation Generator
description: >
  Generates comprehensive documentation from code including API references, README files,
  architecture decision records (ADRs), inline comments, and user guides. Adapts tone and
  detail level to the target audience (developers, end-users, stakeholders).
category: writing
tags:
  - documentation
  - api-docs
  - readme
  - technical-writing
  - adr
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 32000
modalities:
  input:
    - code
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Generating API reference documentation from source code
  - Writing README files for open-source projects
  - Creating Architecture Decision Records (ADRs)
  - Producing onboarding guides for new team members
  - Documenting complex business logic and workflows
example_prompt: |
  Generate comprehensive documentation for this module.

  Include:
  1. Module overview (purpose, responsibilities)
  2. Public API reference (functions, parameters, return types)
  3. Usage examples with common patterns
  4. Error handling guide
  5. Dependencies and prerequisites

  Target audience: developers integrating this module.
  Format: Markdown with code examples.

  Module code:
  ```
  [paste code here]
  ```
related_skills:
  - code-review
  - api-design
  - refactoring-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
