id: sql-query-explainer
name: SQL Query Explainer
description: >
  Explains what a SQL query does in plain language and how it executes. Breaks down joins,
  subqueries, CTEs, and window functions step by step, describes the result set, reads
  EXPLAIN/EXPLAIN ANALYZE output to identify slow scans and missing indexes, and flags
  correctness pitfalls. Helps developers understand, review, and trust unfamiliar SQL.
category: data
tags:
  - sql
  - databases
  - query-plan
  - explain
  - learning
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 8000
modalities:
  input:
    - text
    - code
  output:
    - text
complexity: beginner
use_cases:
  - Explaining a complex query with CTEs and window functions
  - Walking through an unfamiliar query during code review
  - Interpreting EXPLAIN ANALYZE output to find bottlenecks
  - Flagging subtle correctness issues like fan-out joins
example_prompt: |
  Explain this SQL query and how it runs.

  1. Describe in plain language what it returns, step by step
  2. Explain each join, CTE, and window function
  3. Point out any correctness risks (duplicate rows from joins, NULL handling)
  4. If I paste EXPLAIN ANALYZE output, identify the slowest steps and suggest indexes

  Query:
  ```sql
  [paste query here]
  ```
related_skills:
  - sql-generation
  - database-query-optimizer
  - code-explainer
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
