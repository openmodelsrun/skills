id: prompt-regression-testing
name: Prompt Regression Testing
description: >
  Builds regression suites for prompts and agent instructions so teams can detect quality,
  safety, format, and tool-selection regressions before deploying changes.
category: testing
tags: [prompt-engineering, regression-testing, llm, quality]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 16000
modalities: {input: [text, file], output: [text, code]}
complexity: intermediate
use_cases: [Prompt releases, Agent instruction changes, LLM CI pipelines]
example_prompt: "Create a prompt regression suite for this workflow. Include high-value cases, assertions, expected formats, adversarial inputs, scoring, and CI pass criteria."
related_skills: [prompt-engineering, llm-output-evaluation]
compatible_tools: [claude-code, cursor, kiro, any]
