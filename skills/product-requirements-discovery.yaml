id: product-requirements-discovery
name: Product Requirements Discovery
description: >
  Converts a loosely defined opportunity into testable product requirements, user journeys,
  scope boundaries, assumptions, risks, success metrics, and discovery questions.
category: productivity
tags: [product-management, requirements, discovery, user-stories]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 16000
modalities: {input: [text, file], output: [text]}
complexity: intermediate
use_cases: [PRD creation, Feature discovery, Product scope definition]
example_prompt: "Turn this product idea into a requirements brief. Define users, jobs, user journeys, non-goals, assumptions, risks, success metrics, acceptance criteria, and discovery questions."
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-07-15T00:00:00.000Z"
updated_at: "2026-07-15T00:00:00.000Z"
