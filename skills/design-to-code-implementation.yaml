id: design-to-code-implementation
name: Design to Code Implementation
description: >
  Converts a design specification or screenshot into accessible, responsive production UI
  while preserving component boundaries, design tokens, semantic structure, and states.
category: development
tags: [frontend, design-to-code, ui, accessibility]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 32000
modalities: {input: [image, text, code], output: [text, code]}
complexity: advanced
use_cases: [Screenshot implementation, Design handoff, Responsive component development]
example_prompt: "Implement this design as an accessible responsive component. Reuse existing tokens and components, include loading and empty states, and explain the component API."
related_skills: [frontend-design, react-component-generator]
compatible_tools: [claude-code, cursor, github-copilot, kiro, any]
