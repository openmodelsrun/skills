id: csv-data-cleaner
name: CSV Data Cleaner
description: >
  Inspects messy tabular data and produces a repeatable cleaning plan plus code. Detects
  and fixes common issues: inconsistent types, duplicate rows, missing values, malformed
  dates, mixed encodings, whitespace and casing problems, and outliers. Outputs pandas or
  Polars code, a summary of changes, and a validation checklist.
category: data
tags:
  - data-cleaning
  - csv
  - pandas
  - etl
  - data-quality
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 16000
modalities:
  input:
    - text
    - code
    - file
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Standardizing types, dates, and encodings in a raw CSV
  - Deduplicating and imputing missing values with documented rules
  - Generating reusable pandas or Polars cleaning scripts
  - Producing a before/after data quality report
example_prompt: |
  Here is a sample of a messy CSV (first 20 rows below).

  Produce:
  1. A diagnosis of data quality issues (types, nulls, duplicates, date formats, encoding)
  2. A cleaning plan with an explicit rule for each issue
  3. Reproducible pandas code that applies the plan
  4. A validation checklist to confirm the output is clean

  Data:
  ```
  [paste CSV sample here]
  ```
related_skills:
  - data-quality-validator
  - data-analysis
  - data-pipeline-builder
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
