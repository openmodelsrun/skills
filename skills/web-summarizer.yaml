id: web-summarizer
name: Web Content Summarizer
description: >
  Summarizes web pages, PDFs, articles, and documents into concise, structured summaries.
  Extracts key points, main arguments, data, and conclusions. Supports multiple output
  formats including bullet points, executive summaries, and structured notes with citations.
category: research
tags:
  - summarization
  - web
  - pdf
  - articles
  - research
  - reading
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 128000
modalities:
  input:
    - text
    - file
  output:
    - text
complexity: beginner
use_cases:
  - Summarizing long research papers into key findings
  - Creating executive briefs from lengthy reports
  - Extracting actionable items from meeting transcripts
  - Condensing documentation into quick-reference guides
  - Building reading digests from multiple articles
example_prompt: |
  Summarize this article/document:

  [URL or pasted content]

  Provide:
  1. One-paragraph executive summary (3-4 sentences)
  2. Key points as bullet list (5-8 items)
  3. Notable data/statistics mentioned
  4. Main conclusions or recommendations
  5. Questions left unanswered

  Keep the summary under 500 words.
related_skills:
  - research-summarizer
  - technical-writing
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-05-25T12:00:00.000Z"
updated_at: "2026-05-25T12:00:00.000Z"
