id: n-plus-one-query-detector
name: N+1 Query Detector
description: >
  Finds N+1 query patterns in ORM and GraphQL code where a loop or resolver issues one query per
  record instead of a single batched fetch. Explains why each occurrence happens, rewrites it using
  eager loading, joins, or a dataloader-style batcher, and suggests a test or query-count assertion
  to keep the regression from returning.
category: development
tags:
  - performance
  - database
  - orm
  - graphql
  - n-plus-one
  - optimization
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - gpt-5-6-sol
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Spotting N+1 queries in ORM model access inside loops
  - Adding eager loading or joins to collapse repeated queries
  - Introducing a dataloader batcher for GraphQL resolvers
  - Writing a query-count assertion to prevent regressions
example_prompt: |
  Review this code for N+1 query problems.

  ```
  [paste ORM or GraphQL resolver code here]
  ```

  For each occurrence: explain what triggers the extra queries, estimate how many queries run for
  N records, rewrite it to a batched or eager-loaded version, and show a test that asserts the
  query count so this cannot silently regress.
related_skills:
  - database-query-optimizer
  - performance-optimization
  - graphql-schema-generator
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - continue
  - any
created_at: "2026-07-28T00:00:00.000Z"
updated_at: "2026-07-28T00:00:00.000Z"
