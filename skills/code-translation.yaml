id: code-translation
name: Code Translation
description: >
  Translates code between programming languages while preserving logic, idioms, and best
  practices of the target language. Handles differences in type systems, error handling,
  concurrency models, and standard library APIs. Produces idiomatic target code, not
  line-by-line transliteration.
category: development
tags:
  - translation
  - migration
  - polyglot
  - porting
  - language-conversion
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 64000
modalities:
  input:
    - code
    - text
  output:
    - code
    - text
complexity: advanced
use_cases:
  - Migrating Python scripts to TypeScript
  - Porting Java libraries to Kotlin or Go
  - Converting JavaScript to TypeScript with proper types
  - Translating shell scripts to Python for cross-platform support
  - Rewriting legacy code in modern language equivalents
example_prompt: |
  Translate the following code from [source language] to [target language].

  Requirements:
  - Use idiomatic patterns of the target language (not line-by-line translation)
  - Preserve all business logic and edge case handling
  - Use appropriate target language equivalents for:
    - Error handling (exceptions vs Result types vs error codes)
    - Concurrency (async/await, goroutines, threads)
    - Collections and data structures
  - Add type annotations where the target language supports them
  - Note any behavioral differences between source and target

  Source code ([source language]):
  ```
  [paste code here]
  ```
related_skills:
  - refactoring-assistant
  - code-review
  - documentation-generator
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
