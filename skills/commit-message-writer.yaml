id: commit-message-writer
name: Commit Message Writer
description: >
  Generates clear, conventional commit messages from code diffs. Follows Conventional Commits
  specification with appropriate type prefixes, scopes, and descriptions. Handles breaking
  changes, multi-file changes, and produces both concise subjects and detailed bodies.
category: productivity
tags:
  - git
  - commits
  - conventional-commits
  - workflow
  - automation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-sonnet-4-6
  - gpt-5-4-mini
  - gemini-2-5-flash
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - code
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Writing commit messages from staged changes
  - Summarizing large PRs into meaningful commit history
  - Enforcing Conventional Commits in team workflows
  - Generating changelogs from commit history
  - Squash commit message generation
example_prompt: |
  Generate a commit message for the following diff.

  Follow Conventional Commits format:
  - type(scope): subject (max 72 chars)
  - blank line
  - body explaining what and why (not how)
  - footer with breaking changes or issue references

  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore

  Diff:
  ```diff
  [paste git diff here]
  ```
related_skills:
  - code-review
  - documentation-generator
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
