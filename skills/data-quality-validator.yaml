id: data-quality-validator
name: Data Quality Validator
description: >
  Designs data quality checks for tables, pipelines, and warehouses. Generates expectation
  suites covering schema conformance, null and uniqueness constraints, referential integrity,
  freshness, and statistical drift, then wires them into pipelines so bad data is caught before
  it reaches dashboards or models.
category: data
tags:
  - data-quality
  - validation
  - data-engineering
  - great-expectations
  - pipelines
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-8
  - gpt-5-6-sol
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Creating expectation suites for a warehouse table
  - Adding freshness and volume checks to a data pipeline
  - Detecting schema drift between source and destination
  - Setting up statistical drift alerts on key columns
example_prompt: |
  Here is the schema and a sample of our daily "transactions" table. Generate a data quality
  suite: schema checks, null/uniqueness constraints, a referential check against "customers",
  a freshness check, and a drift check on the "amount" column. Provide the checks as runnable
  code and describe how to fail the pipeline when they break.
related_skills:
  - data-pipeline-builder
  - synthetic-data-generator
  - schema-design
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
