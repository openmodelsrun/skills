id: ux-microcopy-writer
name: UX Microcopy Writer
description: >
  Writes and revises interface microcopy: button labels, form hints, empty states,
  confirmations, onboarding steps, tooltips, and notifications. Keeps wording short,
  action-oriented, and consistent with the product voice, and provides alternatives sized
  to the available space with notes for localization.
category: creative
tags: [ux-writing, microcopy, ui-text, onboarding, content-design]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-sonnet-5-5, gpt-6-1-sol, gemini-3-8-flash]
min_context_window: 16000
modalities: {input: [text], output: [text]}
complexity: beginner
use_cases:
  - Rewriting vague button and menu labels
  - Drafting empty states and first-run onboarding text
  - Making confirmation and destructive-action dialogs clear
  - Checking UI text for consistency and translation risk
example_prompt: |
  Write microcopy for this screen.

  Context: [screen purpose, user goal, existing text, voice guidelines, space limits]

  Return:
  1. Recommended text per UI element.
  2. Two alternatives each with length.
  3. Rationale tied to the user goal.
  4. Consistency issues with other screens.
  5. Localization notes.
related_skills: [error-message-improver, brand-voice-designer, localization-helper]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
