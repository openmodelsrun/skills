id: incident-postmortem-writer
name: Incident Postmortem Writer
description: >
  Turns incident timelines, alerts, and chat logs into a clear, blameless postmortem. Produces
  an executive summary, impact assessment, detailed timeline, root-cause analysis using
  techniques like the five whys, and a prioritized list of follow-up action items with owners,
  in a format ready to share with stakeholders.
category: ops
tags:
  - postmortem
  - incident
  - reliability
  - sre
  - root-cause
  - documentation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 32000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Drafting a blameless postmortem from raw incident notes
  - Reconstructing a precise incident timeline
  - Running a structured root-cause analysis
  - Defining prioritized, owned action items
  - Summarizing impact for executive stakeholders
example_prompt: |
  Write a blameless postmortem from these notes.

  - 14:02 alerts fire: API 5xx rate spikes to 40%
  - 14:10 on-call finds a bad deploy rolled out at 13:58
  - 14:18 rollback started
  - 14:31 error rate back to normal
  - Cause: a migration dropped a column still referenced by old pods

  Provide: summary, impact, timeline, root-cause analysis, and action items with owners.
related_skills:
  - incident-response
  - log-analysis
  - technical-writing
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-06-24T00:00:00.000Z"
updated_at: "2026-06-24T00:00:00.000Z"
