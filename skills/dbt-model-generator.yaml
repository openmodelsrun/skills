id: dbt-model-generator
name: dbt Model Generator
description: >
  Generates and refactors dbt models for analytics engineering. Writes staging,
  intermediate, and mart models following layered conventions, adds schema.yml tests and
  descriptions, applies incremental and materialization strategies, and structures sources
  and refs correctly. Produces SQL plus YAML that fits dbt best practices and is ready to run.
category: data
tags:
  - dbt
  - analytics-engineering
  - sql
  - data-modeling
  - transformation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Scaffolding staging, intermediate, and mart models
  - Adding schema.yml tests and column descriptions
  - Converting ad-hoc SQL into layered dbt models
  - Applying incremental materialization to large tables
example_prompt: |
  Generate dbt models for an orders pipeline.

  Sources: raw.orders, raw.customers (Snowflake)
  Goal: a fct_orders mart with customer attributes and daily order metrics.

  Deliver:
  1. stg_orders and stg_customers staging models with light cleaning
  2. An int_ model joining them if needed
  3. fct_orders mart (consider incremental materialization; explain the choice)
  4. schema.yml with not_null/unique/relationships tests and descriptions
  Follow standard dbt layering and use ref()/source() correctly.
related_skills:
  - sql-generation
  - data-pipeline-builder
  - data-contract-designer
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
