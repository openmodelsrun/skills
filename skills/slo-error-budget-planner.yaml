id: slo-error-budget-planner
name: SLO & Error Budget Planner
description: >
  Turns reliability goals into concrete SLIs, SLOs, and error budgets. Helps choose the right
  service level indicators, set realistic targets from historical data, compute burn rates, and
  design multi-window multi-burn-rate alerting so teams get paged before the budget is exhausted.
category: ops
tags:
  - sre
  - reliability
  - slo
  - error-budget
  - alerting
  - monitoring
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-8
  - gpt-5-6-sol
  - gemini-3-5-pro
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Defining SLIs and SLOs for a new service
  - Setting error budgets from historical availability data
  - Designing multi-burn-rate alert rules
  - Facilitating reliability review conversations with stakeholders
example_prompt: |
  Our checkout API served 42M requests last month with 38,000 5xx responses and a p99 latency of
  820ms. Propose availability and latency SLIs, recommend SLO targets with rationale, compute the
  monthly error budget, and give me Prometheus multi-window multi-burn-rate alert rules.
related_skills:
  - observability-instrumentation
  - incident-response
  - incident-postmortem-writer
compatible_tools:
  - claude-code
  - kiro
  - any
