id: react-component-generator
name: React Component Generator
description: >
  Generates production-ready React components with TypeScript, proper props interfaces,
  accessibility attributes, responsive design, and test files. Follows modern patterns
  including Server Components, Suspense boundaries, and composition over inheritance.
category: development
tags:
  - react
  - components
  - frontend
  - typescript
  - ui
  - accessibility
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 32000
modalities:
  input:
    - text
    - image
  output:
    - code
complexity: intermediate
use_cases:
  - Building UI components from design specs or screenshots
  - Creating form components with validation
  - Generating data table components with sorting and filtering
  - Building accessible modal and dialog components
  - Creating reusable layout components
example_prompt: |
  Generate a React component with the following requirements:

  Component: [name and purpose]
  Props:
  - [list expected props]

  Requirements:
  - TypeScript with strict props interface
  - WCAG 2.1 AA accessible (keyboard nav, ARIA, focus management)
  - Responsive (mobile-first)
  - Use [Tailwind CSS / CSS Modules / styled-components]
  - Include loading and error states
  - Export as named export

  Also generate:
  - Unit test file (Vitest + Testing Library)
  - Storybook story with variants
related_skills:
  - accessibility-review
  - unit-test-generation
  - typescript-type-generator
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T12:00:00.000Z"
updated_at: "2026-05-24T12:00:00.000Z"
