id: api-reference-writer
name: API Reference Writer
description: >
  Writes API reference documentation from an OpenAPI spec, route definitions, or source
  code. Documents each endpoint with purpose, authentication, parameters, request and
  response schemas, error codes, and runnable examples in multiple languages, using
  consistent terminology and noting pagination, rate limits, and versioning.
category: writing
tags: [api-docs, reference, documentation, openapi, developer-experience]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-sonnet-5-5, gpt-6-1-sol, gemini-3-8-flash]
min_context_window: 32000
modalities: {input: [text, code], output: [text, code]}
complexity: intermediate
use_cases:
  - Generating endpoint reference pages from an OpenAPI spec
  - Adding request and response examples to undocumented routes
  - Standardizing error and pagination documentation across an API
  - Refreshing reference docs after a breaking version change
example_prompt: |
  Write reference documentation for this API.

  Context: [OpenAPI spec or route code, auth scheme, audience]

  Return:
  1. Overview with base URL, auth, and conventions.
  2. Per-endpoint reference with parameters and schemas.
  3. Request and response examples.
  4. Error codes and how to handle them.
  5. Notes on pagination, rate limits, and versioning.
related_skills: [documentation-generator, openapi-spec-generator, technical-writing]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
