id: git-hooks-manager
name: Git Hooks Manager
description: >
  Sets up and maintains Git hooks for a repository. Recommends a manager (Husky, Lefthook,
  or pre-commit), wires up pre-commit and commit-msg hooks for linting, formatting, type
  checks, secret scanning, and conventional-commit validation, and keeps hooks fast with
  staged-file filtering. Produces config plus a short contributor guide.
category: development
tags:
  - git
  - git-hooks
  - pre-commit
  - linting
  - developer-experience
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 8000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Adding pre-commit lint, format, and type-check hooks
  - Enforcing conventional commit messages via commit-msg
  - Running secret scanning before commits land
  - Keeping hooks fast by only checking staged files
example_prompt: |
  Set up Git hooks for a TypeScript monorepo using pnpm.

  Requirements:
  - pre-commit: run ESLint + Prettier on staged files only, plus a secret scan
  - pre-push: run type-check and affected unit tests
  - commit-msg: enforce Conventional Commits

  Recommend a hook manager with a brief rationale, provide the full config, ensure hooks are
  fast on large repos, and add a short CONTRIBUTING note explaining how to bypass in emergencies.
related_skills:
  - commit-message-writer
  - ci-cd-pipeline
  - secrets-scanner
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
