id: mid-turn-steering-workflow
name: Mid-turn Steering Workflow
description: >
  Structures long-running agent work so new user instructions can be incorporated
  mid-turn without losing the original goal. Defines steering precedence,
  conflict handling, safe interruption points, unchanged-work preservation, and
  final-response reconciliation for complex coding, research, and operations
  tasks.
category: productivity
tags: [agents, steering, long-running-work, workflow, user-control, coordination]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
source_url: https://developers.openai.com/api/docs/guides/latest-model
provenance:
  source_kind: adapted
  canonical_url: https://developers.openai.com/api/docs/guides/latest-model
  license: other
  verified_at: "2026-09-04T00:00:00.000Z"
  publisher: {id: openmodels-community, name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run, verification_status: verified}
recommended_models: [gpt-6-astra, gpt-5-6-sol, claude-fable-5-1]
min_context_window: 64000
modalities: {input: [text], output: [text]}
complexity: intermediate
use_cases:
  - Updating agent goals while a long-running task is in progress
  - Preserving completed work when a user changes requirements
  - Handling conflicting instructions across multi-step workflows
  - Writing final summaries that reflect the newest user request
example_prompt: |
  Create a mid-turn steering protocol for this agent workflow.

  Include:
  1. How new instructions are classified.
  2. What can continue while awaiting user input.
  3. How conflicts are resolved.
  4. How completed work is preserved.
  5. How the final answer proves it followed the latest request.
related_skills: [workflow-automation-design, multi-agent-orchestrator, self-improving-agent]
compatible_tools: [claude-code, cursor, kiro, any]
