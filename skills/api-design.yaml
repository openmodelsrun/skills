id: api-design
name: API Design
description: >
  Designs RESTful and GraphQL APIs following contract-first principles. Covers endpoint
  structure, request/response schemas, error handling, versioning, pagination, authentication,
  and rate limiting. Produces OpenAPI/Swagger specifications and implementation scaffolding.
category: development
tags:
  - api
  - rest
  - graphql
  - openapi
  - architecture
  - design
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 32000
modalities:
  input:
    - text
  output:
    - code
    - text
complexity: advanced
use_cases:
  - Designing new REST API endpoints from requirements
  - Generating OpenAPI specifications
  - API versioning strategy decisions
  - Error response standardization
  - GraphQL schema design with resolvers
example_prompt: |
  Design a REST API for a task management system.

  Requirements:
  - CRUD operations for tasks (title, description, status, assignee, due_date)
  - Task filtering by status, assignee, and date range
  - Pagination with cursor-based navigation
  - Proper error responses with problem details (RFC 7807)
  - Authentication via Bearer token

  Deliverables:
  1. Endpoint list with HTTP methods and paths
  2. Request/response schemas for each endpoint
  3. Error response catalog
  4. OpenAPI 3.1 specification
  5. Rate limiting recommendations
related_skills:
  - documentation-generator
  - security-audit
  - sql-generation
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
