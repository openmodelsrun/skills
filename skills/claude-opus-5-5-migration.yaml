id: claude-opus-5-5-migration
name: Claude Opus 5.5 Migration
description: >
  Plans and executes a migration of an Anthropic integration from Claude Opus 5 or earlier
  to Claude Opus 5.5. Inventories model IDs and request parameters, replaces manual
  extended-thinking budgets with adaptive thinking and effort levels, reviews context-
  window and output-limit assumptions, recalculates cost with the new pricing and cache-
  read rates, and defines an eval and rollout plan.
category: development
tags: [claude, anthropic, migration, model-upgrade, adaptive-thinking, effort]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
source_url: https://platform.claude.com/docs/en/models/opus-5-5/migration-guide
provenance:
  source_kind: adapted
  canonical_url: https://platform.claude.com/docs/en/models/opus-5-5/migration-guide
  license: other
  verified_at: "2026-10-01T00:00:00.000Z"
  publisher: {id: openmodels-community, name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run, verification_status: verified}
recommended_models: [claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1]
min_context_window: 64000
modalities: {input: [text, code], output: [text, code]}
complexity: advanced
use_cases:
  - Moving a production integration from Claude Opus 5 to Claude Opus 5.5
  - Replacing budget_tokens thinking configuration with adaptive thinking and effort
  - Re-estimating cost after a model price and cache-rate change
  - Planning a staged rollout with regression evals and rollback
example_prompt: |
  Plan a migration of this integration to Claude Opus 5.5.

  Context: [current model IDs, request parameters, thinking config, prompts, traffic volume]

  Return:
  1. Inventory of every call site and parameter that must change.
  2. Thinking and effort settings per workload, with rationale.
  3. Context-window and max-output assumptions to revisit.
  4. Cost comparison including cache writes and reads.
  5. Eval set and pass criteria before switching.
  6. Staged rollout and rollback plan.
related_skills: [gpt-6-astra-migration, llm-cost-optimizer, prompt-regression-testing]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
