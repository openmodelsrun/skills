id: ab-test-setup
name: A/B Test Setup
description: >
  Designs and implements A/B testing experiments including hypothesis formulation, sample
  size calculation, variant configuration, metric definition, and statistical analysis
  planning. Covers both frontend feature flags and backend experiment frameworks.
category: data
tags:
  - ab-testing
  - experimentation
  - statistics
  - product
  - analytics
  - feature-flags
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5-5
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - text
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Designing experiments with proper statistical rigor
  - Calculating required sample sizes for desired power
  - Setting up feature flag configurations for gradual rollouts
  - Defining primary and guardrail metrics for experiments
  - Analyzing experiment results and making ship/no-ship decisions
example_prompt: |
  Design an A/B test for the following change:

  Feature: [describe the change]
  Hypothesis: [what you expect to happen]
  Primary metric: [what you're measuring]
  Current baseline: [current metric value]
  Minimum detectable effect: [smallest meaningful improvement]
  Traffic: [daily active users or events]

  Provide:
  1. Experiment design (control vs variants)
  2. Sample size calculation with 80% power, 95% confidence
  3. Expected duration to reach significance
  4. Guardrail metrics to monitor
  5. Feature flag implementation code snippet
  6. Analysis plan (when to check, how to decide)
related_skills:
  - data-analysis
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-05-25T12:00:00.000Z"
updated_at: "2026-05-25T12:00:00.000Z"
