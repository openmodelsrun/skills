id: mobile-app-prototyping
name: Mobile App Prototyping
description: >
  Generates mobile application prototypes and implementations for iOS and Android.
  Creates SwiftUI views, Jetpack Compose layouts, and React Native components from
  descriptions or wireframe images. Handles navigation patterns, state management,
  and platform-specific design guidelines.
