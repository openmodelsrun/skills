complexity: intermediate
use_cases:
  - Converting wireframe images to SwiftUI code
  - Generating React Native screens from descriptions
  - Building Jetpack Compose UI with Material Design 3
  - Creating navigation flows with proper state management
  - Prototyping animations and gesture interactions
example_prompt: |
  Create a SwiftUI implementation of a fitness tracking app home screen.

  Design requirements:
  - Top: greeting with user name and today's date
  - Activity rings (move, exercise, stand) similar to Apple Watch
  - Scrollable list of today's workouts with:
    - Workout type icon
    - Duration and calories
    - Time completed
  - Floating action button to start new workout
  - Bottom tab bar: Home, Activity, Discover, Profile

  Implementation details:
  - Use MVVM architecture
  - SwiftUI with iOS 17+ APIs
  - Proper accessibility labels
  - Dark mode support
  - Smooth animations on ring progress

  Provide the full SwiftUI view hierarchy, view model, and sample data model.
