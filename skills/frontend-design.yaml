id: frontend-design
name: Frontend Design
description: >
  Creates production-grade frontend interfaces with high design quality. Generates
  complete UI components, pages, and layouts using modern frameworks (React, Vue, Svelte)
  with Tailwind CSS or CSS-in-JS. Focuses on unique, polished designs that avoid generic
  AI aesthetics — emphasizing typography, spacing, color harmony, and micro-interactions.
category: creative
tags:
