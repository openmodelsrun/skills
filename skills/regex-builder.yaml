id: regex-builder
name: Regex Builder
description: >
  Builds, explains, and tests regular expressions from natural language descriptions.
  Supports multiple regex flavors (PCRE, JavaScript, Python, Go). Provides step-by-step
  breakdowns, test cases, and performance considerations for complex patterns.
category: development
tags:
  - regex
  - pattern-matching
  - text-processing
  - validation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-sonnet-4-6
  - gpt-5-4-mini
  - gemini-2-5-flash
  - deepseek-v4
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - code
    - text
complexity: beginner
use_cases:
  - Building validation patterns for emails, URLs, phone numbers
  - Parsing structured text formats (logs, CSV, config files)
  - Search and replace operations with capture groups
  - Explaining existing complex regex patterns
  - Converting between regex flavors
example_prompt: |
  Build a regex pattern for the following requirement:

  "[describe what you want to match]"

  Please provide:
  1. The regex pattern
  2. Step-by-step explanation of each part
  3. Test cases (strings that should match and shouldn't)
  4. Any edge cases or limitations
  5. Performance notes if the pattern could be slow on large inputs

  Target flavor: [JavaScript / Python / PCRE / Go]
related_skills:
  - code-review
  - debugging-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
