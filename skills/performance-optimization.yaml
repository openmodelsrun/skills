id: performance-optimization
name: Performance Optimization
description: >
  Identifies and resolves performance bottlenecks in code and systems. Covers algorithmic
  complexity analysis, memory optimization, caching strategies, database query tuning,
  and frontend performance (Core Web Vitals). Follows a measure-first approach.
category: development
tags:
  - performance
  - optimization
  - profiling
  - caching
  - web-vitals
  - algorithms
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 64000
modalities:
  input:
    - code
    - text
  output:
    - code
    - text
complexity: advanced
use_cases:
  - Analyzing algorithmic complexity and suggesting improvements
  - Optimizing database queries and indexing
  - Reducing frontend bundle size and load times
  - Implementing caching strategies (Redis, CDN, memoization)
  - Identifying memory leaks and excessive allocations
example_prompt: |
  Analyze this code for performance issues and suggest optimizations.

  Context:
  - Current performance: [describe metrics, e.g., "API responds in 2s, target is 200ms"]
  - Scale: [e.g., "10k requests/min", "1M rows in table"]
  - Constraints: [e.g., "cannot change the database schema", "must support IE11"]

  Code:
  ```
  [paste code here]
  ```

  Please provide:
  1. Identified bottlenecks with complexity analysis
  2. Prioritized optimization suggestions (highest impact first)
  3. Optimized code with before/after comparison
  4. Measurement approach to verify improvements
  5. Trade-offs of each optimization (memory vs speed, complexity vs performance)
related_skills:
  - refactoring-assistant
  - sql-generation
  - debugging-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
