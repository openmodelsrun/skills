id: api-versioning-strategist
name: API Versioning Strategist
description: >
  Advises on how to evolve APIs without breaking clients. Compares versioning strategies (URI,
  header, media-type), classifies changes as breaking or non-breaking, and produces deprecation
  timelines, migration guides, and compatibility shims so teams can ship changes safely.
category: development
tags:
  - api
  - versioning
  - backward-compatibility
  - deprecation
  - migration
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-8
  - gpt-5-6-sol
  - gemini-3-5-pro
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Choosing a versioning strategy for a public REST API
  - Classifying a proposed change as breaking or non-breaking
  - Writing a deprecation timeline and migration guide
  - Designing compatibility shims for old clients
example_prompt: |
  We need to rename several fields and change a response shape in our public v1 API. Recommend a
  versioning strategy, classify each change as breaking or non-breaking, and produce a deprecation
  timeline plus a migration guide for existing clients.

  ```
  [paste current and proposed API schemas]
  ```
related_skills:
  - api-design
  - openapi-spec-generator
  - migration-planner
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
