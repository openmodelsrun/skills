id: task-prioritizer
name: Task Prioritizer
description: >
  Turns a messy list of tasks into a ranked, actionable plan. Applies a chosen framework
  (Eisenhower urgent/important, RICE, MoSCoW, or value/effort) consistently, surfaces
  dependencies and quick wins, groups work into a realistic today/this-week plan, and
  explains the ranking so the user can adjust the weighting.
category: productivity
tags:
  - prioritization
  - planning
  - productivity
  - task-management
  - decision-making
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - claude-sonnet-4-5
min_context_window: 8000
modalities:
  input:
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Ranking a backlog with RICE or value/effort scoring
  - Sorting a to-do list with the Eisenhower matrix
  - Identifying quick wins and blocking dependencies
  - Turning a task dump into a realistic weekly plan
example_prompt: |
  Prioritize my tasks for the week using RICE, then sanity-check with value/effort.

  Tasks:
  - Fix checkout bug affecting ~5% of users
  - Write Q3 planning doc (due Friday)
  - Refactor legacy auth module
  - Reply to 3 partner emails
  - Prototype new onboarding screen

  For each task, estimate reach/impact/confidence/effort and show the score. Then give a
  today vs this-week plan, flag dependencies and quick wins, and note which estimates are
  most uncertain.
related_skills:
  - okr-planner
  - meeting-agenda-planner
  - product-requirements-writer
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
