id: async-tool-calling-design
name: Async Tool Calling Design
description: >
  Designs agent workflows that let a model continue useful reasoning while
  external tools run asynchronously. Covers tool contracts, pending-call state,
  idempotency, timeout handling, wait-tool patterns, result reconciliation, and
  user-visible progress for long-running business or engineering tasks.
category: development
tags: [tool-calling, async, agents, workflow, orchestration, responses-api]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
source_url: https://developers.openai.com/api/docs/guides/latest-model
