  verified_at: "2026-09-04T00:00:00.000Z"
  publisher: {id: openmodels-community, name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run, verification_status: verified}
recommended_models: [gpt-6-astra, gpt-5-6-sol, claude-fable-5-1]
min_context_window: 64000
modalities: {input: [text, code], output: [text, code]}
complexity: advanced
use_cases:
  - Designing async function-calling loops for slow external APIs
  - Coordinating parallel retrieval, browser, code, and database tools
  - Adding idempotency and timeout recovery to long-running agent tasks
  - Building wait-tool patterns that keep users informed without busy polling
example_prompt: |
  Design async tool calling for this agent workflow.

  Context: [tools, expected runtimes, state store, retry policy]

  Return:
  1. Tool schema changes for async execution.
  2. Pending-call state model.
  3. Timeout, retry, and cancellation behavior.
  4. Result reconciliation rules.
  5. User-facing progress events.
  6. Tests for duplicate delivery and stale results.
related_skills: [tool-call-testing, multi-agent-orchestrator, workflow-automation-design]
compatible_tools: [claude-code, cursor, kiro, any]
