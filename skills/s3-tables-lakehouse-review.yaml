id: s3-tables-lakehouse-review
name: S3 Tables Lakehouse Review
description: >
  Reviews Amazon S3 Tables and Apache Iceberg lakehouse designs for table-bucket
  boundaries, namespaces, schemas, query access, ingestion, maintenance, governance,
  and recovery. Defaults to metadata discovery and read-only SQL, with append or
  metadata changes isolated behind explicit approval.
category: data
tags: [aws, s3, iceberg, lakehouse, sql, data-governance]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
source_url: https://github.com/awslabs/mcp/tree/main/src/s3-tables-mcp-server
