recommended_models: [gpt-5-6-sol, claude-opus-5, gemini-3-6-flash]
min_context_window: 64000
modalities: {input: [text, code, file], output: [text, code]}
complexity: advanced
use_cases:
  - Reviewing S3 Table Bucket and namespace boundaries
  - Designing Iceberg schema and partition evolution
  - Auditing read-only SQL and append workflows
  - Planning maintenance, governance, and recovery controls
example_prompt: |
  Review this Amazon S3 Tables lakehouse design.

  Include table buckets, namespaces, schemas, partitioning, ingestion paths,
  query engines, access roles, retention, and expected volume.

  Return:
  1. A metadata-first discovery checklist.
  2. Table and namespace boundary recommendations.
  3. Schema, partition, and maintenance strategy.
  4. Read-only SQL checks and append validation tests.
  5. IAM, resource-policy, encryption, and audit controls.
  6. Backup, recovery, and explicit approval gates for writes.
related_skills: [data-pipeline-builder, sql-generation, security-audit]
compatible_tools: [claude-code, cursor, kiro, gemini-cli, any]
