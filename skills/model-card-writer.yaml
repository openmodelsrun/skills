id: model-card-writer
name: Model Card Writer
description: >
  Writes model cards and system cards that document a model or AI feature honestly. Covers intended
  use and out-of-scope use, training and evaluation data provenance, benchmark results with their
  caveats, known limitations and failure modes, fairness and safety evaluations, and the
  environmental and licensing details reviewers and regulators expect.
category: writing
tags:
  - model-card
  - documentation
  - ai-governance
  - transparency
  - responsible-ai
  - compliance
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - gpt-5-5-pro
min_context_window: 32000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Documenting a fine-tuned model before internal release
  - Writing a system card covering safety evaluations
  - Stating intended and out-of-scope uses precisely
  - Reporting benchmark results with honest caveats
example_prompt: |
  Write a model card for a fine-tuned classifier we are about to deploy.

  Details: [describe base model, training data, task, eval results]

  Include intended use and explicitly out-of-scope use, data provenance and known gaps, evaluation
  results with caveats about what the benchmarks do not measure, failure modes and limitations,
  fairness considerations across affected groups, and licensing. Flag anything I have not given you
  that a reviewer would expect to see.
related_skills:
  - ai-safety-policy-review
  - technical-writing
  - ai-act-compliance-reviewer
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-08-03T00:00:00.000Z"
updated_at: "2026-08-03T00:00:00.000Z"
