id: incident-postmortem
name: Incident Postmortem
description: >
  Produces blameless, actionable incident postmortems with a precise timeline, contributing
  factors, impact, decisions, corrective actions, owners, and measurable follow-through.
category: ops
tags: [incident-management, postmortem, reliability, operations]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 16000
modalities: {input: [text, code, file], output: [text]}
complexity: intermediate
use_cases: [Production incident review, Reliability improvement, Cross-team learning]
example_prompt: "Write a blameless postmortem from these incident notes. Include timeline, impact, contributing factors, what worked, corrective actions with owners, and verification criteria."
compatible_tools: [claude-code, cursor, kiro, any]
