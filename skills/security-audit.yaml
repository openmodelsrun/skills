id: security-audit
name: Security Audit
description: >
  Performs comprehensive security analysis of code and configurations. Identifies OWASP Top 10
  vulnerabilities, insecure patterns, missing input validation, authentication flaws, and
  secrets exposure. Provides remediation steps with secure code examples.
category: security
tags:
  - security
  - owasp
  - vulnerability
  - audit
  - hardening
  - authentication
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 64000
modalities:
  input:
    - code
    - text
  output:
    - text
    - code
complexity: advanced
use_cases:
  - Pre-deployment security review
  - Identifying injection vulnerabilities (SQL, XSS, command)
  - Authentication and authorization flow analysis
  - Secrets and credential exposure detection
  - Dependency vulnerability assessment
example_prompt: |
  Perform a security audit on the following code.

  Check for:
  1. OWASP Top 10 vulnerabilities
  2. Input validation and sanitization gaps
  3. Authentication/authorization weaknesses
  4. Secrets or credentials in code
  5. Insecure dependencies or configurations
  6. Missing security headers or CORS issues

  For each finding, provide:
  - Severity (critical/high/medium/low)
  - CWE identifier if applicable
  - Vulnerable code snippet
  - Remediation with secure code example
  - References to relevant security standards

  Code to audit:
  ```
  [paste code here]
  ```
related_skills:
  - code-review
  - debugging-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
