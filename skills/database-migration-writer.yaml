id: database-migration-writer
name: Database Migration Writer
description: >
  Writes safe, reversible database schema migrations and the corresponding rollback scripts.
  Plans zero-downtime changes using expand-and-contract patterns, handles data backfills and
  index creation without locking, and generates migrations for tools like Alembic, Flyway,
  Prisma, Knex, and Rails ActiveRecord with clear up/down steps.
category: development
tags:
  - database
  - migrations
  - schema
  - sql
  - zero-downtime
  - backend
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - code
    - text
complexity: intermediate
use_cases:
  - Writing forward and rollback migrations for schema changes
  - Planning zero-downtime expand-and-contract migrations
  - Backfilling data safely on large tables
  - Adding indexes concurrently without locking
  - Generating migrations for Alembic, Flyway, Prisma, or Rails
example_prompt: |
  Write a zero-downtime migration to split a "full_name" column into "first_name" and
  "last_name" on a PostgreSQL "users" table with 20M rows, using Alembic.

  Provide:
  1. Expand-and-contract step plan
  2. Forward migration(s) with non-locking backfill
  3. Application cutover notes
  4. Rollback/down migration
  5. Verification queries
related_skills:
  - schema-design
  - database-query-optimizer
  - migration-planner
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-06-19T00:00:00.000Z"
updated_at: "2026-06-19T00:00:00.000Z"
