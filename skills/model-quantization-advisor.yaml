id: model-quantization-advisor
name: Model Quantization Advisor
description: >
  Advises on quantizing open-weight models for cheaper, faster inference while keeping quality
  acceptable. Compares formats and precisions (GGUF, AWQ, GPTQ, FP8, INT8, 4-bit), estimates memory
  footprint and throughput on target hardware, flags which workloads degrade most under
  quantization, and defines the evaluation needed to confirm the tradeoff is safe.
category: ops
tags:
  - quantization
  - inference
  - optimization
  - open-weights
  - gpu
  - self-hosted
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - gpt-5-6-sol
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: advanced
use_cases:
  - Choosing a quantization format for a target GPU
  - Estimating VRAM footprint and throughput before deploying
  - Deciding how much quality loss is acceptable per workload
  - Designing an eval to verify a quantized model is still good enough
example_prompt: |
  I want to self-host a 70B open-weight model for an internal coding assistant on 2x A100 80GB.

  Recommend a quantization approach: which format and precision, expected VRAM use and tokens per
  second, and where quality is most likely to drop (long context, code correctness, tool calling).
  Define the evaluation I should run before and after to confirm the tradeoff is acceptable.
related_skills:
  - gpu-capacity-planner
  - inference-latency-optimizer
  - llm-cost-optimizer
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-08-03T00:00:00.000Z"
updated_at: "2026-08-03T00:00:00.000Z"
