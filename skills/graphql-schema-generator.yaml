id: graphql-schema-generator
name: GraphQL Schema Generator
description: >
  Designs GraphQL schemas from domain descriptions or existing data models. Produces typed
  SDL with queries, mutations, subscriptions, input types, enums, and interfaces, following
  naming conventions, pagination patterns (Relay-style connections), and error-handling best
  practices. Can also generate resolvers scaffolding and map schemas to existing REST or SQL backends.
category: development
tags:
  - graphql
  - schema
  - api
  - sdl
  - backend
  - resolvers
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-8
  - gpt-5-5
  - gemini-3-1-pro
  - qwen3-coder
min_context_window: 32000
modalities:
  input:
    - text
    - code
  output:
    - code
    - text
complexity: intermediate
use_cases:
  - Designing a GraphQL schema for a new product domain
  - Adding Relay-style pagination to existing types
  - Generating resolver stubs from an SDL schema
  - Mapping a REST or SQL data model to GraphQL types
  - Reviewing a schema for naming and nullability best practices
example_prompt: |
  Design a GraphQL schema for a blogging platform with users, posts, comments, and tags.
  Requirements:
  - Relay-style cursor pagination on posts and comments
  - Mutations for creating/updating/deleting posts with input types
  - A subscription for new comments on a post
  - Proper nullability and an error-handling convention

  Output the SDL and a brief explanation of the key design decisions.
related_skills:
  - schema-design
  - api-design
  - openapi-spec-generator
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-06-12T00:00:00.000Z"
updated_at: "2026-06-12T00:00:00.000Z"
