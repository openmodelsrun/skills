id: recommendation-system-designer
name: Recommendation System Designer
description: >
  Designs recommendation systems end to end: candidate generation, ranking, and re-ranking. Covers
  collaborative filtering, content-based and embedding retrieval, two-tower models, cold-start
  strategies, feature stores, offline/online evaluation (NDCG, recall@k), and feedback loops.
  Produces an architecture and evaluation plan tailored to the product.
category: data
tags:
  - recommendations
  - machine-learning
  - ranking
  - embeddings
  - personalization
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-7
  - gpt-5-5-pro
  - gemini-3-1-pro
  - deepseek-v4
min_context_window: 32000
modalities:
  input:
    - text
  output:
    - text
    - code
complexity: advanced
use_cases:
  - Designing a product recommendation pipeline
  - Choosing candidate generation and ranking approaches
  - Handling cold-start for new users and items
  - Defining offline and online evaluation metrics
  - Building a feedback loop from implicit signals
example_prompt: |
  Design a recommendation system for a marketplace with 2M items and 500K users.
  Provide:
  1. Candidate generation and ranking architecture
  2. Feature and embedding strategy
  3. Cold-start handling for new users/items
  4. Offline metrics (recall@k, NDCG) and an online A/B plan
  5. A feedback loop from clicks and purchases
related_skills:
  - feature-engineering-assistant
  - rag-pipeline-builder
  - ab-test-setup
compatible_tools:
  - claude-code
  - kiro
  - any
