id: scientific-writing
name: Scientific Writing
description: >
  Assists with writing, structuring, and editing scientific manuscripts, grant proposals,
  and technical reports. Supports IMRaD structure, proper citation formatting, abstract
  writing, methods sections with reproducibility details, results interpretation, and
  response to reviewer comments. Adapts to journal-specific guidelines and word limits.
category: writing
tags:
  - scientific-writing
  - manuscripts
  - grants
  - abstracts
  - peer-review
  - imrad
  - latex
  - academic
author:
  name: OpenModels Community
  github: openmodelsrun
source_url: https://github.com/K-Dense-AI/scientific-agent-skills
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 128000
modalities:
  input:
    - text
    - file
  output:
    - text
complexity: advanced
use_cases:
  - Drafting manuscript sections following IMRaD structure
  - Writing grant proposals (NIH, NSF, ERC format)
  - Crafting compelling abstracts within word limits
  - Responding to peer reviewer comments point-by-point
  - Editing for clarity, conciseness, and scientific accuracy
  - Formatting references and citations (APA, Vancouver, Nature)
example_prompt: |
  Help me write the Methods section for a paper on single-cell RNA-seq analysis
  of tumor microenvironment in colorectal cancer.

  Key details:
  - 12 patient samples (6 tumor, 6 adjacent normal)
  - 10X Genomics Chromium, sequenced on NovaSeq 6000
  - Analysis: Scanpy, doublet removal (Scrublet), batch correction (Harmony)
  - Clustering: Leiden algorithm, cell type annotation with marker genes
  - Differential expression: Wilcoxon rank-sum test, BH correction
  - Cell-cell communication: CellChat

  Requirements:
  - Sufficient detail for reproducibility
  - Include software versions and parameters
  - Follow Nature Methods style
  - ~800 words
  - Include a "Data availability" statement
  - Include a "Code availability" statement
related_skills:
  - literature-review
  - research-summarizer
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
