id: mcp-tool-description-optimizer
name: MCP Tool Description Optimizer
description: >
  Reviews and rewrites the tool names, descriptions, and input schemas of an MCP server so
  models pick the right tool and fill arguments correctly. Removes overlap between tools,
  clarifies when to use each one, tightens parameter types and enums, trims token-heavy
  descriptions, and proposes test prompts to verify tool selection.
category: development
tags: [mcp, tool-descriptions, tool-calling, schemas, agents]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-opus-5-5, gpt-6-astra, gpt-6-1-sol]
min_context_window: 32000
modalities: {input: [text, code], output: [text, code]}
complexity: intermediate
use_cases:
  - Fixing an MCP server whose tools are called with wrong arguments
  - Reducing context cost from long tool descriptions
  - Disambiguating overlapping tools in a large tool list
  - Preparing tool definitions before publishing an MCP server
example_prompt: |
  Optimize the tool definitions of this MCP server.

  Context: [tool list with descriptions and schemas, observed mis-calls]

  Return:
  1. Overlaps and ambiguities between tools.
  2. Rewritten names and descriptions.
  3. Tightened input schemas with types, enums, and required fields.
  4. Token count before and after.
  5. Test prompts to check selection and arguments.
related_skills: [mcp-server-builder, tool-call-testing, structured-output-design]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
