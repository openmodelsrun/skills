id: ai-codebase-onboarding
name: AI Codebase Onboarding
description: >
  Turns an unfamiliar repository into a concise engineering guide covering architecture,
  conventions, local setup, key execution paths, and low-risk first contributions.
category: development
tags: [codebase, onboarding, architecture, developer-experience]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 64000
modalities: {input: [code, text, file], output: [text, code]}
complexity: intermediate
use_cases: [Developer onboarding, Repository discovery, Contribution planning]
example_prompt: "Analyze this repository for a new engineer. Explain its architecture, local setup, conventions, key modules, and propose three safe starter tasks."
related_skills: [documentation-generator, system-design]
compatible_tools: [claude-code, cursor, github-copilot, kiro, any]
