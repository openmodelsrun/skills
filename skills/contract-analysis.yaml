id: contract-analysis
name: Contract Analysis
description: >
  Analyzes legal and business contracts to extract key terms, identify risks, compare
  clauses against standard templates, and generate summaries. Highlights unusual provisions,
  missing protections, and negotiation points. Supports NDAs, SaaS agreements, employment
  contracts, and vendor agreements.
category: research
tags:
  - contract
  - legal
  - analysis
  - compliance
  - risk-assessment
  - document-review
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 128000
modalities:
  input:
    - text
    - file
  output:
    - text
complexity: advanced
use_cases:
  - Extracting key terms and obligations from SaaS agreements
  - Identifying unusual or risky clauses in vendor contracts
  - Comparing contract terms against industry-standard templates
  - Generating executive summaries of complex legal documents
  - Highlighting negotiation points and missing protections
example_prompt: |
  Analyze the following SaaS service agreement and provide a structured review.

  Focus on:
  1. Key commercial terms (pricing, payment, term length, auto-renewal)
  2. SLA commitments (uptime guarantee, credits, measurement method)
  3. Data handling (ownership, processing, deletion rights, subprocessors)
  4. Liability and indemnification (caps, carve-outs, mutual vs one-way)
  5. Termination provisions (for cause, for convenience, wind-down period)
  6. IP ownership and licensing scope
  7. Unusual or non-standard clauses
  8. Missing protections we should negotiate

  For each finding, rate risk as: low / medium / high
  Provide a negotiation priority list with recommended language changes.

  Contract text:
  [paste contract text here]
related_skills:
  - research-summarizer
  - technical-writing
compatible_tools:
  - claude-code
  - kiro
  - any
