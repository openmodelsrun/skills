id: ansible-playbook-writer
name: Ansible Playbook Writer
description: >
  Writes idempotent Ansible playbooks and roles from a described target state. Structures
  tasks with proper handlers, variables, and templates; favors modules over shell commands;
  applies role-based layout and inventory grouping; and adds check-mode safety and tags.
  Produces playbooks that are re-runnable without unintended side effects.
category: ops
tags:
  - ansible
  - configuration-management
  - automation
  - infrastructure
  - idempotency
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Writing an idempotent playbook to provision a web server
  - Refactoring shell-heavy tasks into proper Ansible modules
  - Structuring reusable roles with variables and handlers
  - Adding tags and check-mode support to existing playbooks
example_prompt: |
  Write an Ansible playbook to configure an Ubuntu 24.04 web node.

  Target state:
  - Install and enable nginx
  - Deploy a site config from a template with a variable server_name
  - Ensure a deploy user exists with an authorized key
  - Open ports 80/443 via ufw

  Requirements: idempotent, use official modules (not shell) where possible, organize as a
  role, add handlers for nginx reload, and support --check mode. Include a sample inventory.
related_skills:
  - infrastructure-as-code
  - terraform-module-writer
  - cloud-deploy
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
