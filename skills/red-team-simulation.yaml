id: red-team-simulation
name: AI Red Team Simulation
description: >
  Simulates realistic adversarial behavior against AI features to uncover prompt injection,
  data exfiltration, unsafe tool use, jailbreak, and authorization failures before launch.
category: security
tags: [red-team, ai-safety, prompt-injection, threat-modeling]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 32000
modalities: {input: [text, code, file], output: [text, code]}
complexity: advanced
use_cases: [AI security reviews, Agent threat modeling, Pre-release adversarial testing]
example_prompt: "Create a red-team plan for this AI workflow. Model attacker goals, trust boundaries, adversarial prompts, tool abuse paths, expected controls, and reproducible test cases."
compatible_tools: [claude-code, cursor, kiro, any]
