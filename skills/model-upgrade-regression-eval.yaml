id: model-upgrade-regression-eval
name: Model Upgrade Regression Eval
description: >
  Builds an evaluation plan for swapping one LLM for another in production. Assembles a
  representative test set from real traffic, defines graded criteria and automated checks,
  compares the two models on quality, latency, cost, refusals, and tool-call correctness,
  and sets pass thresholds that gate the rollout.
category: testing
tags: [evals, regression, model-upgrade, quality, release-gate]
author: {name: OpenModels Community, github: openmodelsrun, url: https://www.openmodels.run}
recommended_models: [claude-opus-5-5, gpt-6-astra, gpt-6-1-sol]
min_context_window: 64000
modalities: {input: [text, code], output: [text, code]}
complexity: advanced
use_cases:
  - Deciding whether a newly released model can replace the current one
  - Catching behavior regressions before a model version switch
  - Comparing tool-call accuracy and structured-output validity across models
  - Setting release gates for a staged model rollout
example_prompt: |
  Design a regression eval for this model upgrade.

  Context: [current model, candidate model, product tasks, available logs, risk tolerance]

  Return:
  1. Test set sources and sampling plan.
  2. Metrics and grading method per task.
  3. Side-by-side comparison protocol.
  4. Pass thresholds and blocking failures.
  5. Shadow or canary rollout plan with monitoring.
related_skills: [agent-evals, llm-output-evaluation, prompt-regression-testing]
compatible_tools: [claude-code, cursor, kiro, any]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
