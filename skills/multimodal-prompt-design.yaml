id: multimodal-prompt-design
name: Multimodal Prompt Design
description: >
  Writes prompts that combine images, video, documents, and text effectively. Covers ordering
  images relative to instructions, resolution and tiling tradeoffs that affect token cost and
  detail, grounding questions to specific regions or pages, requesting structured output from
  visual input, and reducing visual hallucination on charts, tables, and scanned documents.
category: creative
tags:
  - multimodal
  - vision
  - prompt-engineering
  - document-understanding
  - ocr
  - structured-output
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - qwen3-8-max
min_context_window: 32000
modalities:
  input:
    - text
    - image
    - video
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Extracting structured data from scanned invoices or forms
  - Asking precise questions about charts and diagrams
  - Ordering images and instructions for best accuracy
  - Cutting token cost on high-resolution image input
example_prompt: |
  I need to extract line items from scanned invoices of varying quality into JSON.

  Design the multimodal prompt: how to order the image and instructions, what resolution to send
  and the cost tradeoff, how to define the output schema, how the model should signal low
  confidence on unreadable fields instead of guessing, and how to handle multi-page invoices.
  Include the prompt and a validation step for the returned JSON.
related_skills:
  - prompt-engineering
  - pdf-data-extraction
  - structured-output-design
compatible_tools:
  - claude-code
  - kiro
  - gemini-cli
  - any
created_at: "2026-08-03T00:00:00.000Z"
updated_at: "2026-08-03T00:00:00.000Z"
