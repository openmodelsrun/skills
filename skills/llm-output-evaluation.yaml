id: llm-output-evaluation
name: LLM Output Evaluation
description: >
  Defines repeatable quality evaluation for LLM outputs using representative datasets,
  scoring rubrics, model-graded checks, human review sampling, and regression thresholds.
category: testing
tags: [llm, evaluation, quality, regression-testing]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 32000
modalities: {input: [text, file], output: [text, code]}
complexity: advanced
use_cases: [LLM quality gates, Prompt benchmarking, Model migration validation]
example_prompt: "Create an evaluation plan for this LLM feature, including representative cases, a scored rubric, automated checks, human-review sampling, and release thresholds."
related_skills: [llm-eval-harness-builder, prompt-engineering]
compatible_tools: [claude-code, cursor, kiro, any]
