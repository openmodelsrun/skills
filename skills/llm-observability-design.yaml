id: llm-observability-design
name: LLM Observability Design
description: >
  Designs traces, metrics, structured events, privacy controls, dashboards, and alerts for
  LLM applications so teams can diagnose quality, cost, latency, and tool-use behavior.
category: ops
tags: [llm, observability, tracing, monitoring]
author: {name: OpenModels Community, github: openmodelsrun}
recommended_models: [claude-opus-4-6, gpt-5, gemini-2-5-pro]
min_context_window: 16000
modalities: {input: [text, code], output: [text, code]}
complexity: advanced
use_cases: [LLM production monitoring, Agent trace design, Cost and latency dashboards]
example_prompt: "Design observability for this LLM application. Specify trace spans, events, metrics, redaction rules, dashboards, alerts, sampling, and incident queries."
compatible_tools: [claude-code, cursor, kiro, any]
