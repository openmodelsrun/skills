id: jwt-analyzer
name: JWT Analyzer
description: >
  Decodes and reviews JSON Web Tokens and their surrounding auth flow for correctness and
  security. Explains header and claims, checks algorithm and key handling, validates
  expiration and audience/issuer claims, and flags common pitfalls such as the alg:none
  attack, weak secrets, missing validation, and over-long token lifetimes. Never treats
  token contents as trusted secrets to echo back.
category: security
tags:
  - jwt
  - authentication
  - tokens
  - oauth
  - security
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - deepseek-v4
  - qwen3-coder
min_context_window: 8000
modalities:
  input:
    - text
    - code
  output:
    - text
complexity: intermediate
use_cases:
  - Decoding and explaining a JWT's header and claims
  - Reviewing token validation logic for security gaps
  - Detecting alg:none, weak secrets, or missing audience/issuer checks
  - Recommending sensible token lifetimes and rotation
example_prompt: |
  Review our JWT setup for security issues.

  1. Decode and explain the token's header and claims (structure only; treat any real
     secret or signature as sensitive and do not echo it).
  2. Review the verification code below for gaps.
  3. Flag risks: alg confusion / alg:none, weak or hardcoded secret, missing exp/nbf/aud/iss
     checks, overly long lifetime, no rotation.
  4. Give concrete fixes with corrected code.

  Verification code:
  ```
  [paste code here]
  ```
related_skills:
  - oauth-flow-implementer
  - security-audit
  - secrets-scanner
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
