id: cli-tool-builder
name: CLI Tool Builder
description: >
  Designs and scaffolds ergonomic command-line tools with subcommands, flags, config files,
  shell completions, and helpful error output. Covers argument parsing conventions, exit codes,
  stdin/stdout piping, colored output, progress indicators, and cross-platform packaging.
  Produces maintainable CLIs that follow POSIX conventions and feel great to use.
category: development
tags:
  - cli
  - developer-tools
  - command-line
  - automation
  - scripting
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - deepseek-v4
min_context_window: 16000
modalities:
  input:
    - text
    - code
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Scaffolding a CLI with subcommands and flags
  - Adding shell completion for bash/zsh/fish
  - Designing consistent exit codes and error messages
  - Supporting config files with env var overrides
  - Packaging a CLI for npm, Homebrew, or a single binary
example_prompt: |
  Build a CLI tool named "deploykit" that supports:
  1. Subcommands: init, build, deploy, status
  2. Global flags: --config, --verbose, --json
  3. Config file resolution with env var overrides
  4. Helpful error messages and POSIX exit codes
  5. Shell completion generation

  Language: [describe your language/framework]
related_skills:
  - technical-writing
  - github-workflow
  - env-config-generator
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
