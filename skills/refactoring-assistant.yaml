id: refactoring-assistant
name: Refactoring Assistant
description: >
  Guides systematic code refactoring while preserving exact behavior. Identifies code smells,
  suggests appropriate refactoring patterns, and executes transformations incrementally with
  verification at each step. Follows Chesterton's Fence principle — understands why code
  exists before changing it.
category: development
tags:
  - refactoring
  - code-quality
  - clean-code
  - design-patterns
  - technical-debt
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 64000
modalities:
  input:
    - code
    - text
  output:
    - code
    - text
complexity: advanced
use_cases:
  - Reducing cyclomatic complexity in large functions
  - Extracting reusable components or modules
  - Migrating from legacy patterns to modern idioms
  - Eliminating code duplication (DRY principle)
  - Improving testability through dependency injection
example_prompt: |
  Refactor the following code to improve readability and maintainability.

  Requirements:
  - Preserve exact existing behavior (no functional changes)
  - Apply one refactoring pattern at a time
  - Explain the rationale for each change
  - Suggest tests to verify behavior is preserved
  - Flag any code where the purpose is unclear (Chesterton's Fence)

  Code to refactor:
  ```
  [paste code here]
  ```
related_skills:
  - code-review
  - unit-test-generation
  - documentation-generator
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T10:00:00.000Z"
updated_at: "2026-05-24T10:00:00.000Z"
