id: image-alt-text-writer
name: Image Alt Text Writer
description: >
  Writes concise, useful alternative text for images that conveys the information a sighted reader
  gets from them. Adapts to context (informative, functional, decorative, or complex images),
  recommends empty alt for purely decorative graphics, and produces longer descriptions plus
  captions for charts and diagrams where a short string is not enough.
category: writing
tags:
  - accessibility
  - alt-text
  - wcag
  - a11y
  - images
  - inclusive-design
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-5
  - gemini-3-6-flash
  - gemini-3-5-flash-lite
min_context_window: 16000
modalities:
  input:
    - text
    - image
  output:
    - text
complexity: beginner
use_cases:
  - Writing alt text for product and editorial images
  - Deciding when an image should have empty alt text
  - Describing charts and diagrams beyond a short alt string
  - Auditing existing alt text for redundancy or missing information
example_prompt: |
  Write alt text for the attached images.

  For each one: state whether it is informative, functional, decorative, or complex; give the alt
  text (or explain why empty alt is correct); and for any chart or diagram add a longer description
  that conveys the data trend. Keep alt text short and avoid phrases like "image of".
related_skills:
  - accessibility-review
  - accessibility-audit
  - technical-writing
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-28T00:00:00.000Z"
updated_at: "2026-07-28T00:00:00.000Z"
