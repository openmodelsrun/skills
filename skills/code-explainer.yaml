id: code-explainer
name: Code Explainer
description: >
  Explains complex code in plain language at the requested level of detail. Breaks down
  algorithms, design patterns, and architecture decisions. Adapts explanation depth from
  high-level overview to line-by-line walkthrough based on audience.
category: development
tags:
  - explanation
  - learning
  - onboarding
  - mentoring
  - documentation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - gpt-5
  - gemini-2-5-pro
min_context_window: 32000
modalities:
  input:
    - code
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Onboarding new team members to a codebase
  - Understanding unfamiliar open-source libraries
  - Learning new programming patterns and idioms
  - Documenting complex algorithms for future maintainers
  - Code review preparation
example_prompt: |
  Explain the following code.

  Audience: [junior developer / senior developer / non-technical stakeholder]
  Depth: [high-level overview / detailed walkthrough / line-by-line]

  Please include:
  1. What this code does (purpose)
  2. How it works (mechanism)
  3. Why it's written this way (design decisions)
  4. Any potential issues or improvements
  5. Related concepts to learn more about

  Code:
  ```
  [paste code here]
  ```
related_skills:
  - documentation-generator
  - refactoring-assistant
compatible_tools:
  - claude-code
  - cursor
  - github-copilot
  - kiro
  - any
created_at: "2026-05-24T12:00:00.000Z"
updated_at: "2026-05-24T12:00:00.000Z"
