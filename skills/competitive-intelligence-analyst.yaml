id: competitive-intelligence-analyst
name: Competitive Intelligence Analyst
description: >
  Builds structured competitive analyses from public information. Maps competitors across
  positioning, pricing, features, target segments, and go-to-market motion; produces
  feature-comparison matrices and SWOT summaries; and highlights differentiation gaps and
  opportunities. Emphasizes citing sources and separating verified facts from inference.
category: research
tags:
  - competitive-analysis
  - market-research
  - strategy
  - swot
  - benchmarking
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - grok-4
min_context_window: 32000
modalities:
  input:
    - text
  output:
    - text
complexity: intermediate
use_cases:
  - Building a feature and pricing comparison matrix
  - Producing SWOT summaries for a set of competitors
  - Identifying positioning gaps and differentiation opportunities
  - Preparing a competitive briefing for sales or product teams
example_prompt: |
  Analyze the competitive landscape for a self-hosted feature-flag tool.

  Competitors: LaunchDarkly, Flagsmith, Unleash

  Produce:
  1. A comparison matrix (pricing model, hosting, SDK coverage, targeting rules, audit/RBAC)
  2. A short SWOT for each competitor
  3. Three differentiation opportunities for a new entrant

  For every claim, note whether it is verified from public info or an inference, and cite
  the type of source. Do not invent pricing you cannot confirm.
related_skills:
  - market-research-analyst
  - research-summarizer
  - product-requirements-writer
compatible_tools:
  - claude-code
  - kiro
  - any
created_at: "2026-07-12T00:00:00.000Z"
updated_at: "2026-07-12T00:00:00.000Z"
