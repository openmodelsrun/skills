id: email-triage-assistant
name: Email Triage Assistant
description: >
  Helps process a busy inbox quickly. Categorizes messages by urgency and type, extracts
  action items and deadlines, drafts short reply options, and proposes an order to handle
  them. Summarizes long threads into the decision needed and flags anything sensitive or
  requiring escalation, so you can clear the inbox with fewer decisions.
category: productivity
tags:
  - email
  - inbox
  - productivity
  - triage
  - prioritization
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-6
  - gpt-5
  - gemini-2-5-pro
  - claude-sonnet-4-5
min_context_window: 16000
modalities:
  input:
    - text
  output:
    - text
complexity: beginner
use_cases:
  - Sorting a batch of emails by urgency and required action
  - Extracting action items and deadlines from threads
  - Drafting quick reply options for common messages
  - Summarizing a long thread into the decision needed
example_prompt: |
  Here are 8 emails from my inbox (pasted below). Help me triage them.

  For each email:
  1. Category (action needed / waiting / FYI / spam)
  2. Urgency (today / this week / whenever)
  3. The specific action and any deadline
  4. A one-line draft reply if a response is needed

  Then give me a suggested order to handle them and flag anything sensitive or worth escalating.

  Emails:
  [paste emails here]
related_skills:
  - email-writer
  - task-prioritizer
  - meeting-notes-summarizer
compatible_tools:
  - claude-code
  - kiro
  - any
