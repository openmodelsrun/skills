id: secrets-scanner
name: Secrets Scanner
description: >
  Scans code, configuration, and git history for leaked credentials such as API keys, tokens,
  private keys, and connection strings. Classifies findings by severity and false-positive
  likelihood, and provides safe remediation steps including rotation, history scrubbing, and
  pre-commit prevention.
category: security
tags:
  - security
  - secrets
  - credentials
  - static-analysis
  - remediation
author:
  name: OpenModels Community
  github: openmodelsrun
recommended_models:
  - claude-opus-4-8
  - gpt-5-6-sol
  - gemini-3-5-pro
min_context_window: 32000
modalities:
  input:
    - code
    - text
  output:
    - text
    - code
complexity: intermediate
use_cases:
  - Finding hardcoded credentials in a repository
  - Triaging secret findings by severity and false-positive risk
  - Producing rotation and git-history scrubbing steps
  - Adding pre-commit hooks to prevent future leaks
example_prompt: |
  Scan the following files for leaked secrets. For each finding, report the type of credential,
  a severity, whether it looks like a false positive, and exact remediation steps (rotate,
  scrub from history, add to ignore). Then propose a pre-commit configuration to prevent
  future leaks.

  ```
  [paste files / config here]
  ```
related_skills:
  - security-audit
  - dependency-auditor
  - threat-modeling
compatible_tools:
  - claude-code
  - cursor
  - kiro
  - any
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-07-09T00:00:00.000Z"
