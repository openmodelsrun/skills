complexity: intermediate
use_cases:
  - Quickly prototyping a SaaS landing page from a product brief
  - Generating A/B test variants for marketing campaigns
  - Creating event or launch announcement pages
  - Building portfolio or personal brand pages
  - Producing email-capture squeeze pages
example_prompt: |
  Create a modern landing page for "FlowMetrics" — a real-time analytics dashboard for SaaS companies.

  Product details:
  - Tracks MRR, churn, LTV, and cohort retention
  - Integrates with Stripe, Paddle, and Chargebee
  - Real-time alerts via Slack and email
  - Starts at $29/month

  Requirements:
  - Use Tailwind CSS
  - Dark theme with accent color #6366f1
  - Sections: Hero with CTA, Features (3-4), Integrations logos, Pricing (3 tiers), FAQ, Footer
  - Mobile responsive
  - Include meta tags for SEO
