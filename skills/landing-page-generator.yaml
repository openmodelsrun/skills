id: landing-page-generator
name: Landing Page Generator
description: >
  Generates complete, responsive landing pages from a product description or brief.
  Produces semantic HTML, modern CSS (Tailwind or vanilla), and optional JavaScript
  for interactions. Follows conversion-optimized layouts with hero sections, features,
  social proof, pricing, and CTAs.
